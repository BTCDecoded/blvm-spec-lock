name: Lean evidence

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Pinned btc-lean gates
    runs-on: [self-hosted, Linux, X64, builds]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: Rob1Ham/btc-lean
          ref: d390f7932e64a134aec3cca1614bed3276539f2d
          path: btc-lean

      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main

      - name: Negative tests
        run: cargo test --bin cargo-spec-lock -- fails_the_gate residual_row cited_module

      - name: Static gates at the pin
        env:
          BTC_LEAN_ROOT: ${{ github.workspace }}/btc-lean
        run: cargo run --bin cargo-spec-lock -- lean-gate
