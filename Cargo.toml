[package]
name = "blvm-spec-lock"
version = "0.1.30"

edition = "2024"
authors = ["Bitcoin Commons Team"]
description = "BLVM Spec Lock: Purpose-built formal verification tool for Bitcoin Commons"
license = "MIT"
repository = "https://github.com/BTCDecoded/blvm-spec-lock"
homepage = "https://btcdecoded.org"
rust-version = "1.85"

[lib]
proc-macro = true

[[bin]]
name = "cargo-spec-lock"
path = "src/bin/cargo-spec-lock.rs"

[dependencies]
# Proc macro dependencies
syn = { version = "2.0", features = ["full", "parsing", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

# Utilities — Orange Paper markdown is parsed with regex directly (no cmark needed).
regex = "1.10"
sha2 = "0.10"

# Z3 SMT solver for verification (optional - requires libclang to build)
z3 = { version = "0.12", optional = true }

# CLI dependencies
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"

# File system and path utilities — directory traversal uses std::fs::read_dir recursively.
toml = "0.8"

[features]
default = ["z3"]
# Z3 SMT solver for full contract verification (default; requires libclang to build)
z3 = ["dep:z3"]

[dev-dependencies]
insta = "1.43"

[lints.rust]
unexpected_cfgs = { level = "warn" }
